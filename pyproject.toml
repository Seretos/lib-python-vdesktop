[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-python-vdesktop"
version = "0.1.9"
description = "Windows virtual-desktop & window automation engine (pyvda/COM desktops, Win32 window ops, layouts, app launchers) for the Seretos agent-plugin ecosystem"
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "pyvda>=0.4",
  "pywin32>=306; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
  "uiautomation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-timeout>=2.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# ticket #34: bound every test at 60s so a wedged test aborts the run instead
# of hanging it; on Windows a hit dumps thread stacks then aborts the session.
timeout = 60
timeout_method = "thread"
