name: release

# Manual lib-release flow. Analogous to the plugin's release.yml but without
# the binary build (this lib ships as a Python source dist pulled by downstream
# consumers via `git+https://.../@vX.Y.Z`). Topology:
#
#   publish (ubuntu-22.04) -> validates semver, fails on duplicate tag, stamps
#                             pyproject.toml with the requested version on a
#                             fresh release branch built off main, tags the
#                             stamp commit as vX.Y.Z, force-pushes release/Nx
#                             (a floating branch consumers MAY pin), creates the
#                             GitHub Release, then opens a dependency-update
#                             ticket in each consuming repo (agent-vdesktop) via
#                             the central `notify-consumers` action.
#                             `main` is never touched.
#
# Release-branch policy:
#   release/0.x  — all 0.x.y releases.  Force-pushed each release.
#   release/Nx   — created the first time an Nx.y.z release is published.
# Past tags remain reachable via `@vX.Y.Z` even after a force-push because the
# commit they point to is preserved by git as long as the tag exists.
#
# Consumers pin an EXACT tag (`@vX.Y.Z`) for deterministic builds. The
# notify-consumers step (below) is how a new release reaches them: it does NOT
# bump anyone's pin, it files an actionable ticket so a human/agent does the
# bump deliberately.
#
# "Create GitHub Release" passes --notes-start-tag explicitly (computed by
# scripts/prev_release_tag.py) because release tags are the orphaned stamp
# commits described above, never ancestors of one another, so gh's own
# ancestor-walk auto-detection can't find the previous tag and silently
# falls back to the whole project history.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

      - name: Check tag does not yet exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute release-branch name
        id: branch
        shell: bash
        run: |
          V="${{ inputs.version }}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          BRANCH="release/${MAJOR}.x"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Will publish to ${BRANCH}"

      - name: Stamp pyproject.toml, commit, tag, force-push release branch
        # Stamp via sed (POSIX, no extra tools), anchored to start of line to
        # avoid touching nested versions in tool tables. The stamp commit lives
        # only on the release/Nx branch — main stays at whatever HEAD it was.
        shell: bash
        run: |
          V="${{ inputs.version }}"
          TAG="v${V}"
          BRANCH="${{ steps.branch.outputs.name }}"

          sed -i -E 's/^(version[[:space:]]*=[[:space:]]*")[^"]*(")/\1'"$V"'\2/' pyproject.toml
          grep -E "^version[[:space:]]*=[[:space:]]*\"$V\"" pyproject.toml \
            || { echo "::error::pyproject.toml stamp failed"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pyproject.toml
          # --allow-empty: when the requested version equals the version already
          # committed in pyproject.toml (e.g. the very first release matching the
          # repo's placeholder), the sed stamp is a no-op and there is nothing to
          # commit. We still want a dedicated release commit on the branch to tag.
          git commit -m "release: ${TAG}" --allow-empty

          git tag -a "$TAG" -m "${TAG}"

          git push origin "$BRANCH" --force
          git push origin "$TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          PRE_FLAG=""
          if [[ "${{ inputs.version }}" == *-* ]]; then
            PRE_FLAG="--prerelease"
          fi

          # Release tags are orphaned stamp commits (never ancestors of one
          # another), so gh's own auto-detection of the previous tag can't
          # walk history and falls back to the whole project. Compute
          # v<prev> ourselves and pass it explicitly; omit the flag on a
          # first release instead of passing an empty value.
          PREV_TAG=$(git tag -l 'v*' | python3 scripts/prev_release_tag.py "${{ inputs.version }}")
          NOTES_START=()
          if [[ -n "$PREV_TAG" ]]; then
            echo "Previous release tag: ${PREV_TAG}"
            NOTES_START=(--notes-start-tag "$PREV_TAG")
          else
            echo "No previous tag found — treating as first release."
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            "${NOTES_START[@]}" \
            $PRE_FLAG

      # Opens a dependency-update ticket in each consuming repo via the central
      # notify-consumers action (changelog + board placement live there).
      # Non-fatal and runs last, after the release artifacts are published.
      - name: Open dependency-update tickets in consumers
        continue-on-error: true
        uses: Seretos/agent-plugin-dev/.github/actions/notify-consumers@main
        with:
          version: ${{ inputs.version }}
          source_repo: ${{ github.repository }}
          consumers: Seretos/agent-vdesktop
          gh_token: ${{ secrets.ECOSYSTEM_TOKEN }}
