name: release

# Manual lib-release flow. Analogous to the plugin's release.yml but without
# the binary build (this lib ships as a Python source dist pulled by downstream
# consumers via `git+https://.../@vX.Y.Z`). Topology:
#
#   publish (ubuntu-22.04) -> validates semver, fails on duplicate tag, stamps
#                             pyproject.toml with the requested version on a
#                             fresh release branch built off main, tags the
#                             stamp commit as vX.Y.Z, force-pushes release/Nx
#                             (a floating branch consumers MAY pin), creates the
#                             GitHub Release, then opens a dependency-update
#                             ticket in each consuming repo (agent-vdesktop).
#                             `main` is never touched.
#
# Release-branch policy:
#   release/0.x  — all 0.x.y releases.  Force-pushed each release.
#   release/Nx   — created the first time an Nx.y.z release is published.
# Past tags remain reachable via `@vX.Y.Z` even after a force-push because the
# commit they point to is preserved by git as long as the tag exists.
#
# Consumers pin an EXACT tag (`@vX.Y.Z`) for deterministic builds. The ticket
# step (below) is how a new release reaches them: it does NOT bump anyone's pin,
# it files an actionable ticket so a human/agent does the bump deliberately.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

      - name: Check tag does not yet exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute release-branch name
        id: branch
        shell: bash
        run: |
          V="${{ inputs.version }}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          BRANCH="release/${MAJOR}.x"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Will publish to ${BRANCH}"

      - name: Stamp pyproject.toml, commit, tag, force-push release branch
        # Stamp via sed (POSIX, no extra tools), anchored to start of line to
        # avoid touching nested versions in tool tables. The stamp commit lives
        # only on the release/Nx branch — main stays at whatever HEAD it was.
        shell: bash
        run: |
          V="${{ inputs.version }}"
          TAG="v${V}"
          BRANCH="${{ steps.branch.outputs.name }}"

          sed -i -E 's/^(version[[:space:]]*=[[:space:]]*")[^"]*(")/\1'"$V"'\2/' pyproject.toml
          grep -E "^version[[:space:]]*=[[:space:]]*\"$V\"" pyproject.toml \
            || { echo "::error::pyproject.toml stamp failed"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pyproject.toml
          git commit -m "release: ${TAG}"

          git tag -a "$TAG" -m "${TAG}"

          git push origin "$BRANCH" --force
          git push origin "$TAG"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          PRE_FLAG=""
          if [[ "${{ inputs.version }}" == *-* ]]; then
            PRE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            $PRE_FLAG

      # Open a dependency-update ticket in each consuming repo. Uses a PAT
      # (VDESKTOP_TICKET_TOKEN, Issues:write on the consumer) — the built-in
      # GITHUB_TOKEN only has rights in THIS repo, not cross-repo. Idempotent:
      # re-running the same version won't open a duplicate ticket. This runs
      # last, after the release artifacts are published, so a ticket hiccup
      # never blocks the release itself — use ticket.yml to re-file by hand.
      - name: Open dependency-update ticket in consumers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VDESKTOP_TICKET_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          CONSUMERS="Seretos/agent-vdesktop"
          TAG="v${VERSION}"
          TITLE="chore(deps): bump lib-python-vdesktop to ${TAG}"
          BODY=$(cat <<EOF
          A new release of **lib-python-vdesktop** is available: \`${TAG}\`.

          Update the pin in \`pyproject.toml\`:

          \`\`\`
          lib-python-vdesktop @ git+https://github.com/${{ github.repository }}@${TAG}
          \`\`\`

          Then rebuild the \`.exe\` (\`scripts/build.ps1\`) and run the test suite.

          Release notes: https://github.com/${{ github.repository }}/releases/tag/${TAG}
          EOF
          )
          for REPO in $CONSUMERS; do
            existing=$(gh issue list --repo "$REPO" --state open \
              --search "in:title \"$TITLE\"" --json number --jq 'length')
            if [ "$existing" != "0" ]; then
              echo "Ticket already open in $REPO for ${TAG} — skipping."
              continue
            fi
            gh issue create --repo "$REPO" \
              --title "$TITLE" \
              --label dependencies \
              --body "$BODY"
            echo "Filed update ticket in $REPO for ${TAG}."
          done
